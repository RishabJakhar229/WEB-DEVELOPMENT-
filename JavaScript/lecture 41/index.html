<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>


    <form action="" id="form">
        <div>
            <label for="username">Name</label>
            <input type="text" id="username" placeholder="Enter Your Name">
            <span class="error-message" style="color: red;"></span>
        </div>
        <br>
        <div>
            <label for="email">Email</label>
            <input type="text" id="email" placeholder="Enter Your Email">
            <span class="error-message" style="color: red;"></span>
        </div>
        <br>
        <div>
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter Your password">
            <span class="error-message" style="color: red;"></span>
        </div>
        <p id="password-hint" class="hidden">Must be least 8 characters</p>
        <br>

        <div>
            <label for="bio">Bio:</label>
            <textarea name="bio" id="bio" placeholder="Enter Your Bio:"></textarea>
            <p id="char-count"></p>
            <span class="error-message" style="color: red;"></span>
        </div>
        <div>
            <label for="country">Select your country</label>
            <select name="country" id="country">
                <option value="india">India</option>
                <option value="usa">USA</option>
                <option value="uk">UK</option>
                <option value="china">China</option>
            </select>
            <span class="error-message" style="color: red;"></span>
        </div>


        <div>
            <input type="checkbox" id="checkbox">
            <label for="checkbox">I agree to the terma and conditions.</label>
        </div>
        <br>
        <button type="submit" id="btn">Create Account</button>
    </form>

    <h1 class="hidden">Account Created Successfully</h1>


    <script src="index.js"></script>
</body>

</html>
