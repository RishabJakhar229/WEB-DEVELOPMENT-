<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1 align="center">Pete's Pizza Delivery</h1>
    <h2 align="center">Online Order Form</h2>
    <p align="center">*Required Fields</p>
    <div>
        <form action="">
            <fieldset>
                <legend>Customer details</legend>
                 <label for="rs">*Name:</label>
                <input type="text" id="rs"><br><br>
                <label for="we">*Address:</label>
                <input type="text" id="we"><br><br>
                <label for="qw">*Town/City</label>
                <input type="text" id="qw"><br><br>
                <label for="as">*Postcode:</label>
                <input type="number" id="as"><br><br>
                <label for="za">*tel:</label>
                <input type="number" id="za"><br><br>
                <label for="ds">*Email</label>
                <input type="email" id="ds"><br>
               
            </fieldset>
        </form>

    </div>
    <div>
        <form action="">
            <fieldset>
                <legend>Topping*</legend>
                <input type="radio" name="margherita" id="os">
                <label for="os">margherita</label><br>
                
                <input type="radio" name="margherita" id="ps">
                <label for="ps">Four season</label><br>
                
                <input type="radio" name="margherita" id="is">
                <label for="is">meat feast</label><br>
                
            </fieldset>
        </form>
    </div>
    <div>
        <form action="">
            <fieldset>
                <legend>size*</legend>
                <input type="radio" name="small" id="ees">
                <label for="ees">small</label><br>
                <input type="radio" name="small" id="rs">
                <label for="rs">medium</label><br>
                <input type="radio" name="small" id="vs">
                <label for="vs">large</label><br>
            </fieldset>
        </form>
    </div>
    <div>
        <form action="">
            <fieldset>
                <legend>Extras</legend>
                 <input type="radio" name="Mushrooms" id="eess">
                <label for="eess">Mushrooms</label><br>
                 <input type="radio" name="Green peppers" id="eew">
                <label for="eew">Green peppers</label><br>
                 <input type="radio" name="Anchovies" id="wees">
                <label for="wees">Anchovies</label><br>
                 <input type="radio" name="Extra cheese" id="aees">
                <label for="aees">Extra cheese</label><br>
            </fieldset>
        </form>
    </div>
    <div>
        <form action="">
            <fieldset>
                <legend>Delivery</legend>
                <label for="rt">Preffered delivery time</label>
                <input type="time" id="rt"><br><br>
                <label for="res">Delivery instructions:</label><br>
                <textarea name="res" id="res" rows="8" cols="200"></textarea>
            </fieldset>
        </form>
    </div>
    <br>
    <p align="center">
         <button>submit order</button>
    </p>
   
</body>

</html>
